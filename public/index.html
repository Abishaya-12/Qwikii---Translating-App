<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Qwikii Translator Chat</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <div class="login-screen" id="loginScreen">
      <div class="login-card">
        <img class="logo" src="logo.jpeg" alt="Qwikii logo" />
        <h1>Qwikii</h1>
        <p class="subtitle">Chat in your language. Translate for your friend.</p>
        <label>
          Username
          <input id="nameInput" placeholder="Enter your name" />
        </label>
        <label>
          Your send language
          <select id="sendLang"></select>
        </label>
        <label>
          Your view language
          <select id="viewLang"></select>
        </label>
        <label>
          Friend name
          <input id="friendInput" placeholder="Enter friend name" />
        </label>
        <button type="button" id="addFriendBtn">Add Friend</button>
        <button id="loginBtn">Start Chat</button>
      </div>
    </div>

    <div class="chat-screen hidden" id="chatScreen">
      <header class="chat-header">
        <div class="window-title">
          <span>Inbox</span>
        </div>
        <button id="logoutBtn">close</button>
      </header>

      <div class="inbox-panel">
        <img class="inbox-image" src="inbox.jpg" alt="Pixel inbox" />
        <div class="inbox-info">
          <span class="inbox-label">Pixel Inbox</span>
        </div>
      </div>

      <div class="chat-meta">
        <span id="welcomeText"></span>
        <span id="languageText"></span>
      </div>

      <div class="friends-panel">
        <div class="friends-title">Friends</div>
        <div class="friends-list" id="friendsList"></div>
        <div class="friend-add">
          <input id="friendInputChat" placeholder="Add friend" />
          <button type="button" id="addFriendBtnChat">Add</button>
        </div>
      </div>

      <div class="chat-box" id="chatBox"></div>

      <div class="input-panel">
        <textarea id="msgInput" placeholder="Type your message here..."></textarea>
        <button id="sendBtn">Send</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
